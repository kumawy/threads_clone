name: ThreadsClone
options:
  bundleIdPrefix: com.aslan
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
targets:
  ThreadsClone:
    type: application
    platform: iOS
    sources:
      - ThreadsClone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aslan.ThreadsClone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Threads
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  ThreadsCloneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ThreadsCloneTests
    dependencies:
      - target: ThreadsClone
  ThreadsCloneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ThreadsCloneUITests
    dependencies:
      - target: ThreadsClone
schemes:
  ThreadsClone:
    build:
      targets:
        ThreadsClone: all
    test:
      targets:
        - ThreadsCloneTests
        - ThreadsCloneUITests
